<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0b1728" />
      <stop offset="50%" stopColor="#060d17" />
      <stop offset="100%" stopColor="#040810" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fae3b3" />
      <stop offset="50%" stopColor="#e6c387" />
      <stop offset="100%" stopColor="#c59b58" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="50%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with refined border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Outer Islamic Ring Pattern -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#1e385c" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-opacity="0.6" filter="url(#glow)" />

  <!-- Crescent Moon Symbol -->
  <path d="M 280 130 A 135 135 0 1 0 375 320 A 110 110 0 1 1 280 130 Z" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Emerald Star / Kaaba Radiance -->
  <circle cx="345" cy="185" r="18" fill="url(#emeraldGrad)" filter="url(#glow)" />
  <polygon points="345,155 352,175 375,178 358,193 363,215 345,202 327,215 332,193 315,178 338,175" fill="url(#goldGrad)" />

  <!-- Typography "سكينة" Center Subtle Emboss -->
  <text x="256" y="430" font-family="'Thmanyah Sans', 'Noto Sans Arabic', sans-serif" font-size="44" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">سَكِينة</text>
  <text x="256" y="462" font-family="sans-serif" font-size="14" font-weight="700" fill="#e6c387" text-anchor="middle" letter-spacing="4">SAKINA</text>
</svg>
